<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lessons - MentorGuild</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <img src="assets/icons/mentorguilldlogo.png" alt="MentorGuild logo" class="logo logo--small">
    </header>

    <main class="lessons-page">
        <h1 class="lessons-title">Lessons</h1>
        <!-- CREATE LESSON FORM -->
        <section class="lessons-outer">
            <h2>Create Lesson</h2>
            <form id="lesson-form">
                <input
                    type="text"
                    id="title"
                    placeholder="Lesson title"
                    required
                >

                <input
                    type="text"
                    id="topic"
                    placeholder="Lesson topic"
                    required
                >

                <textarea
                    id="content"
                    placeholder="Lesson content"
                    required
                ></textarea>

                <input
                        type="text"
                        id="tags"
                        placeholder="Comma separated tags"
                >

                <button type="submit" class="start-button">
                        Create Lesson

                </button>
            </form>
        </section>

        <!-- LESSONS DISPLAY -->
        <section class="lessons-outer">
            <div class="lessons-grid" id="lessons-grid">
            </div>
        </section>

        <p style="text-align:center; margin-top:18px;"><a class="start-button" href="/">← Back to home</a></p>
    </main>
    <footer class="site-footer"><small>© MentorGuild</small></footer>
    <script defer src="js/app.js"></script>
</body>
</html>
